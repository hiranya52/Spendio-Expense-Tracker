<div class="fixed bottom-6 right-6 z-50" *ngIf="message">
<div class="relative flex flex-col min-w-[380px] bg-[#1a1220cc] backdrop-blur-xl border border-white/10 rounded-xl shadow-[0_20px_50px_rgba(158,79,222,0.25)] overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-[#bd5fff] shadow-[0_0_15px_#bd5fff]"></div>
<div class="flex items-center gap-4 p-5">
<div class="flex items-center justify-center size-9 rounded-full bg-primary/20 border border-primary/30 shrink-0">
<span class="material-symbols-outlined text-primary text-xl font-bold">check</span>
</div>
<div class="flex-1">
<div class="flex items-center gap-2">
<p class="text-slate-100 text-[15px] font-semibold leading-tight tracking-tight">{{message}}</p>
<!-- <button class="text-slate-400 text-[13px] font-medium underline underline-offset-4 hover:text-slate-200 transition-colors">Undo</button> -->
</div>
<!-- <p class="text-slate-400/80 text-[12px] mt-1 font-medium">Synced with your cloud account</p> -->
</div>
<button class="ml-2 shrink-0 text-slate-500 hover:text-slate-200 transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-xl">close</span>
</button>
</div>
<div class="absolute bottom-0 left-1 right-0 h-[3px] bg-white/5">
<div class="h-full bg-gradient-to-r from-primary to-[#bd5fff] animate-drain shadow-[0_0_8px_#bd5fff]"></div>
</div>
</div>
</div>
