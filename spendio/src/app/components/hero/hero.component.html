<main
  class="relative min-h-screen flex flex-col md:flex-row items-stretch overflow-hidden"
>

        <div
          class="w-full h-px bg-gradient-to-r from-transparent via-white/20 to-transparent"

      </div>
      <div
        class="absolute w-[250px] h-[350px] md:w-[400px] md:h-[500px] bg-zinc-800/80 -translate-x-12 translate-y-24 rotate-12 hero-shape border border-white/10 backdrop-blur-sm"

          <span class="material-icons opacity-20 text-4xl"

        </div>
      </div>

      <div

        <div class="flex items-center gap-4 mb-4">
          <div
            class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center"
          >
            <span class="material-icons text-white">insights</span>
          </div>
          <div>
            <p class="text-[10px] uppercase tracking-widest opacity-40">
              Monthly Savings
            </p>
            <p class="text-lg font-semibold">+$2,450.00</p>

        </div>
        <div class="w-48 h-1 bg-white/5 rounded-full overflow-hidden">
          <div class="w-2/3 h-full bg-white"></div>
        </div>
      </div>
    </div>

  <div
    class="relative w-full md:w-[45%] min-h-screen flex flex-col justify-center px-8 md:px-20 lg:px-24 bg-background-light dark:bg-background-dark py-24"
  >
    <div class="max-w-xl">
      <div
        class="inline-flex items-center gap-2 px-3 py-1 bg-zinc-900/5 dark:bg-zinc-100/10 rounded-full mb-8"
      >
        <span
          class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"
        ></span>
        <span
          class="text-[10px] uppercase tracking-[0.2em] font-medium opacity-70"
          >New: Version 2.0 Live</span
        >
      </div>
      <h1
        class="font-display text-6xl md:text-7xl lg:text-8xl font-medium leading-[1.1] tracking-tight mb-8"
      >
        Manage Smarter. <br />
        <span class="italic text-gray-400 dark:text-zinc-600"
          >Track Everywhere.</span
        >
      </h1>
      <p
        class="text-lg md:text-xl text-gray-600 dark:text-zinc-400 leading-relaxed mb-12 max-w-lg"
      >
        Elevate your financial management with professional tools designed for
        clarity. Beautiful, high-contrast interfaces for the modern
        entrepreneur.
      </p>
      <div class="flex flex-col sm:flex-row items-center gap-6">
        <button
          class="w-full sm:w-auto px-10 py-5 bg-black dark:bg-white text-white dark:text-black text-lg font-medium rounded-full hover:scale-[1.02] active:scale-95 transition-all shadow-xl shadow-black/10"
        >
          Get Started
        </button>
        <button
          class="w-full sm:w-auto px-10 py-5 border border-zinc-200 dark:border-zinc-800 text-lg font-medium rounded-full hover:bg-zinc-50 dark:hover:bg-zinc-900 transition-all flex items-center justify-center gap-2 group"
        >
          Live Demo
          <span
            class="material-icons text-sm group-hover:translate-x-1 transition-transform"
            >arrow_forward</span
          >
        </button>
      </div>
    </div>
