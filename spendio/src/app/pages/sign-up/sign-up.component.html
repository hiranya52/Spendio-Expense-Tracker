<div
  class="bg-background-dark font-display text-slate-100 h-screen w-full overflow-hidden flex selection:bg-primary selection:text-white"
>
  <div class="flex w-full h-full">
    <div
      class="hidden lg:flex w-[55%] relative flex-col justify-end p-12 overflow-hidden bg-black image-glow"
    >
      <div class="grain-overlay mix-blend-overlay"></div>
      <div
        class="absolute inset-0 w-full h-full bg-cover bg-center opacity-70"
        data-alt="Abstract dark 3D geometric shapes with charcoal and ash textures"
        style="
          background-image: url(&quot;https://lh3.googleusercontent.com/aida-public/AB6AXuCMvTcNceFGcMtfpeb62n_wbSeKEOuXyFC17B5tb9OniHUBecOjzmGhkF0R044O9XrASCm_u9zGWU-Dtmi1SPGVQapmAaLwoYk064lCyIrPYgiwW82PvdrJuhGa4zQodArFw4UXL2S8TTI4GoEnqzfendH8VEc55PpxLsNyLHpOPA9BHAEb4nf1gg8-NCsjOKdGQD4i9vkNSMrRsJ6OeuxZ7d3ye5qzU6iaNrLCILGxPfwyZcXm92rHOeVpzyr5wfK8YsVO6dlW6dQ&quot;);
        "
      >
        <div
          class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent mix-blend-multiply"
        ></div>
        <div
          class="absolute inset-0 bg-gradient-to-tr from-primary/10 via-transparent to-transparent mix-blend-screen"
        ></div>
      </div>
      <div class="relative z-20 max-w-lg">
        <h2
          class="font-serif text-5xl text-white mb-6 leading-tight drop-shadow-lg"
        >
          Master your finances with clarity.
        </h2>
        <p
          class="text-slate-300 text-lg font-light leading-relaxed drop-shadow-md"
        >
          Join thousands of users who have transformed their spending habits
          through minimalist tracking.
        </p>
      </div>
    </div>
    <div
      class="w-full lg:w-[45%] h-full flex items-center justify-center p-6 lg:p-12 relative bg-black"
    >
      <div class="absolute inset-0 overflow-hidden">
        <div
          class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary/20 rounded-full blur-[120px] pointer-events-none"
        ></div>
        <div
          class="absolute bottom-[-10%] left-[-10%] w-[400px] h-[400px] bg-primary/10 rounded-full blur-[100px] pointer-events-none"
        ></div>
      </div>
      <div
        class="absolute inset-0 w-full h-full lg:hidden bg-cover bg-center opacity-20 z-0"
        data-alt="Abstract dark background for mobile"
        style="
          background-image: url(&quot;https://lh3.googleusercontent.com/aida-public/AB6AXuA6oph9G6whQIrIRLq5ijSuJoVMWz3OcoL6jw-w6cdNe4JSw0BJ6KGkbnzhIGic8w9ZOwWwOfHeZKQH5UHq12GuppDNBUpLMt9pFDRPsmQgFz4GIN0NbDbcHaDOWkbnof4IwUsUKzewHEk0GoB9nMhYjPSEUPhPknY45bZZFLF81Ck54b3CxwlYfnVaPbzHliUD9GtQqFfaHv40KzO43q3HMYt0LP97uQrX08LVjeUvoMKLBBtERL0wBs0tLdb8PDXF6YRh-SnFYW8&quot;);
        "
      ></div>
      <div
        class="w-full max-w-[480px] bg-card-dark/80 backdrop-blur-md border border-border-purple rounded-2xl shadow-glow-purple relative z-10 p-8 md:p-12 overflow-y-auto max-h-full"
      >
        <div class="mb-10 text-center">
          <div
            class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-primary/20 mb-4 text-primary shadow-[0_0_15px_rgba(139,92,246,0.3)]"
          >
            <span class="material-symbols-outlined text-3xl"
              >account_balance_wallet</span
            >
          </div>
          <h1 class="font-serif text-4xl font-bold text-white mb-2">
            Create Account
          </h1>
          <p class="text-slate-400 font-medium text-sm">
            Start tracking your expenses today
          </p>
        </div>
        <form class="flex flex-col gap-5">
          <label class="block">
            <span class="text-white text-sm font-semibold mb-1.5 block ml-1"
              >Full Name</span
            >
            <div class="relative group">
              <span
                class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-primary transition-colors"
              >
                <span class="material-symbols-outlined text-[20px]"
                  >person</span
                >
              </span>
              <input
                class="w-full pl-11 pr-4 py-3.5 bg-input-dark border border-slate-700/50 rounded-lg text-white placeholder:text-slate-600 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-sm font-medium"
                placeholder="John Doe"
                type="text"
              />
            </div>
          </label>
          <label class="block">
            <span class="text-white text-sm font-semibold mb-1.5 block ml-1"
              >Email Address</span
            >
            <div class="relative group">
              <span
                class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-primary transition-colors"
              >
                <span class="material-symbols-outlined text-[20px]">mail</span>
              </span>
              <input
                class="w-full pl-11 pr-4 py-3.5 bg-input-dark border border-slate-700/50 rounded-lg text-white placeholder:text-slate-600 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-sm font-medium"
                placeholder="name@company.com"
                type="email"
              />
            </div>
          </label>
          <label class="block">
            <span class="text-white text-sm font-semibold mb-1.5 block ml-1"
              >Password</span
            >
            <div class="relative group">
              <span
                class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-primary transition-colors"
              >
                <span class="material-symbols-outlined text-[20px]">lock</span>
              </span>
              <input
                class="w-full pl-11 pr-4 py-3.5 bg-input-dark border border-slate-700/50 rounded-lg text-white placeholder:text-slate-600 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-sm font-medium"
                placeholder="••••••••"
                type="password"
              />
              <button
                class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 focus:outline-none transition-colors"
                type="button"
              >
                <span class="material-symbols-outlined text-[20px]"
                  >visibility_off</span
                >
              </button>
            </div>
            <div class="mt-2 flex items-center justify-between">
              <p class="text-xs text-slate-500 ml-1">
                Must be at least 8 characters
              </p>
            </div>
          </label>
          <div class="flex items-start mt-2 ml-1">
            <div class="flex items-center h-5">
              <input
                class="w-4 h-4 border border-slate-600 rounded bg-input-dark focus:ring-offset-0 focus:ring-primary text-primary cursor-pointer accent-primary"
                id="terms"
                type="checkbox"
              />
            </div>
            <div class="ml-3 text-sm">
              <label class="text-slate-400" for="terms"
                >I agree to the
                <a
                  class="font-medium text-white hover:text-primary hover:underline transition-colors"
                  href="#"
                  >Terms</a
                >
                and
                <a
                  class="font-medium text-white hover:text-primary hover:underline transition-colors"
                  href="#"
                  >Privacy Policy</a
                >.</label
              >
            </div>
          </div>
          <button
            class="mt-4 w-full bg-primary hover:bg-primary-hover text-white font-bold py-4 px-6 rounded-full transition-all duration-200 shadow-[0_4px_20px_-2px_rgba(139,92,246,0.5)] active:scale-[0.98] flex justify-center items-center gap-2 border border-primary/20"
            type="submit"
          >
            <span>Create Account</span>
            <span class="material-symbols-outlined text-sm font-bold"
              >arrow_forward</span
            >
          </button>
        </form>
        <div class="mt-8 text-center pt-6 border-t border-slate-800">
          <p class="text-slate-400 text-sm">
            Already have an account?
            <a
              class="font-bold text-primary hover:text-primary-hover transition-colors ml-1 inline-flex items-center gap-1 group/link drop-shadow-[0_0_8px_rgba(139,92,246,0.4)]"
              routerLink="/logIn"
            >
              Login
              <span
                class="material-symbols-outlined text-base transition-transform group-hover/link:translate-x-0.5"
                >chevron_right</span
              >
            </a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
