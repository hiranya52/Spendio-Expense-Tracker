<div
  class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display antialiased min-h-screen flex flex-col overflow-hidden"
>
  <div class="flex flex-1 w-full h-screen">
    <!-- Left Side: Artistic Abstract Area -->
    <div
      class="hidden lg:flex flex-1 relative bg-[#0a0a0a] items-center justify-center overflow-hidden"
    >
      <!-- Noise Texture Overlay -->
      <div
        class="absolute inset-0 bg-noise opacity-30 z-10 pointer-events-none"
      ></div>
      <!-- Abstract Background Gradients/Shapes -->
      <div
        class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-[#1a1122] via-[#050505] to-[#000000] z-0"
      ></div>
      <!-- Main Abstract 3D Element Representation -->
      <div
        class="relative z-20 w-[80%] h-[80%] flex items-center justify-center"
      >
        <!-- Using a high-quality abstract 3D render placeholder -->
        <div
          class="w-full h-full bg-contain bg-center bg-no-repeat opacity-90 transition-transform duration-700 hover:scale-105"
          data-alt="Abstract 3D dark geometric shape with charcoal and purple lighting"
        >      <img src="pic.png" width="9001" class="ml-32"></div>
        <!-- Floating geometric accents -->
        <div
          class="absolute top-1/4 left-1/4 w-32 h-32 bg-primary/20 rounded-full blur-[60px]"
        ></div>
        <div
          class="absolute bottom-1/3 right-1/4 w-40 h-40 bg-purple-900/30 rounded-full blur-[80px]"
        ></div>
      </div>
      <!-- Brand / Slogan -->
      <div class="absolute bottom-12 left-12 z-30">
        <h3 class="text-white text-2xl font-bold tracking-tight">Spendio</h3>
        <p class="text-gray-400 mt-2 text-sm max-w-xs leading-relaxed">
          Master your finances with elegance and precision. The premium choice
          for modern expense tracking.
        </p>
      </div>
    </div>
    <!-- Right Side: Login Form Container -->
    <div
      class="flex-1 flex flex-col justify-center items-center p-6 sm:p-12 lg:p-24 relative z-10 bg-[#050505]"
    >
      <!-- Decorative background glow for the right side -->
      <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div
          class="absolute -top-[20%] -right-[10%] w-[500px] h-[500px] bg-primary/5 rounded-full blur-[100px]"
        ></div>
      </div>
      <!-- Clean White Container -->
      <div
        class="w-full max-w-md bg-[#f8f9fa] text-slate-900 rounded-2xl shadow-2xl overflow-hidden relative z-20 p-8 sm:p-10 border border-white/10"
      >
        <div class="flex flex-col gap-6">
          <!-- Header -->
          <div class="text-center sm:text-left">
            <h1
              class="text-3xl sm:text-4xl font-extrabold text-[#1a1122] tracking-tight mb-2"
            >
              Welcome Back
            </h1>
            <p class="text-slate-500 text-sm sm:text-base">
              Please enter your details to access your dashboard.
            </p>
          </div>
          <!-- Form -->
          <form action="#" class="flex flex-col gap-5 mt-2" method="POST">
            <!-- Email Input -->
            <div class="flex flex-col gap-1.5">
              <label
                class="text-xs font-semibold uppercase tracking-wider text-slate-500"
                for="email"
                >Email</label
              >
              <div class="relative group">
                <div
                  class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors"
                >
                  <span class="material-symbols-outlined text-[20px]"
                    >mail</span
                  >
                </div>
                <input
                  class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-lg text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-200"
                  id="email"
                  name="email"
                  placeholder="john@example.com"
                  required=""
                  type="email"
                />
              </div>
            </div>
            <!-- Password Input -->
            <div class="flex flex-col gap-1.5">
              <div class="flex justify-between items-center">
                <label
                  class="text-xs font-semibold uppercase tracking-wider text-slate-500"
                  for="password"
                  >Password</label
                >
              </div>
              <div class="relative group">
                <div
                  class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors"
                >
                  <span class="material-symbols-outlined text-[20px]"
                    >lock</span
                  >
                </div>
                <input
                  class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-lg text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-200"
                  id="password"
                  name="password"
                  placeholder="••••••••"
                  required=""
                  type="password"
                />
              </div>
              <div class="flex justify-end mt-1">
                <a
                  class="text-xs font-medium text-slate-500 hover:text-primary transition-colors"
                  href="#"
                  >Forgot Password?</a
                >
              </div>
            </div>
            <!-- Login Button -->
            <button
              class="mt-4 w-full bg-[#1a1122] hover:bg-primary text-white font-bold py-3.5 px-4 rounded-full transition-all duration-300 transform hover:shadow-lg hover:-translate-y-0.5 flex items-center justify-center gap-2 group"
              type="submit"
            >
              <span>Login</span>
              <span
                class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform"
                >arrow_forward</span
              >
            </button>
          </form>
          <!-- Divider -->
          <div class="relative flex py-2 items-center">
            <div class="flex-grow border-t border-slate-100"></div>
            <span class="flex-shrink-0 mx-4 text-slate-300 text-xs">OR</span>
            <div class="flex-grow border-t border-slate-100"></div>
          </div>
          <!-- Social / Alternative -->
          <button
            class="w-full border border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-slate-600 font-semibold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-3"
          >
            <svg
              class="w-5 h-5"
              viewbox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4"
              ></path>
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853"
              ></path>
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                fill="#FBBC05"
              ></path>
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                fill="#EA4335"
              ></path>
            </svg>
            <span class="text-sm">Sign in with Google</span>
          </button>
          <!-- Sign Up Link -->
          <div class="text-center mt-2">
            <p class="text-sm text-slate-500">
              Don't have an account?
              <a
                class="text-[#1a1122] font-bold hover:text-primary transition-colors underline decoration-2 decoration-transparent hover:decoration-primary underline-offset-4"
                href="#"
                >Sign Up</a
              >
            </p>
          </div>
        </div>
      </div>
      <!-- Footer links for right side (Mobile/Tablet view mostly) -->
      <div class="mt-8 flex gap-6 text-sm text-slate-500/60 z-20">
        <a class="hover:text-slate-400 transition-colors" href="#">Privacy</a>
        <a class="hover:text-slate-400 transition-colors" href="#">Terms</a>
        <a class="hover:text-slate-400 transition-colors" href="#">Help</a>
      </div>
    </div>
  </div>
</div>
